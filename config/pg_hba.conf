# Blackbook pg_hba.conf — client authentication rules (referenced by
# postgresql.conf `hba_file`). Order matters: the first matching line wins.
#
# Policy: TLS is mandatory for every TCP connection, passwords are SCRAM, and
# plaintext TCP is explicitly refused. Only the internal Docker subnet is
# reachable in the first place (the DB port is not published to the host in
# production; the override file may publish it for local dev).
#
# TYPE        DATABASE  USER  ADDRESS          METHOD

# In-container unix socket (psql break-glass / the init phase): SCRAM password.
local         all       all                    scram-sha-256

# Mutual TLS: the client must present a CA-signed certificate whose CN equals
# the role name (clientcert=verify-full) AND pass SCRAM. Both ends authenticated.
hostssl       all       all   172.25.0.0/16    scram-sha-256  clientcert=verify-full
# --- For password-only TLS (no client cert), use this line instead:
# hostssl     all       all   172.25.0.0/16    scram-sha-256

# Refuse any non-TLS TCP attempt outright (defense in depth; nothing falls
# through to a plaintext method).
hostnossl     all       all   0.0.0.0/0        reject
hostnossl     all       all   ::/0             reject

# Anything not matched above is denied by PostgreSQL's default-deny.
