# PostgreSQL configuration for Blackbook — security-focused.
#
# Loaded explicitly via `postgres -c config_file=/etc/postgresql/postgresql.conf`
# in docker-compose.yml. (Previously this file was mounted but NEVER loaded, so
# none of it took effect — that is now fixed.) Because it is the active
# config_file it must be self-contained; pg_hba.conf is referenced below.

# ============================================================================
# CONNECTIONS
# ============================================================================
listen_addresses = '*'                 # reachable only on the internal Docker network
port = 5432
max_connections = 100
data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'

# ============================================================================
# AUTHENTICATION & TLS
# ============================================================================
password_encryption = 'scram-sha-256'  # no MD5

ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file  = '/etc/postgresql/certs/server.key'
ssl_ca_file   = '/etc/postgresql/certs/ca.crt'    # enables optional client-cert (mTLS) verification
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# ============================================================================
# LOGGING (to stderr → captured by Docker's json-file driver, which rotates)
# ============================================================================
logging_collector = off
log_connections = on
log_disconnections = on
log_statement = 'ddl'                  # schema changes only — NOT every query
log_min_error_statement = 'error'
log_min_duration_statement = 250       # also log slow (>250ms) statements
log_line_prefix = '%t [%p] user=%u,db=%d,app=%a,client=%h '
# Bind parameter values (which for Blackbook are already AES-GCM ciphertext) and
# passwords are never logged at these settings.

# ============================================================================
# RESOURCES (sized for the 512M container)
# ============================================================================
shared_buffers = '128MB'
effective_cache_size = '384MB'
maintenance_work_mem = '64MB'
work_mem = '4MB'
wal_buffers = '8MB'
checkpoint_completion_target = 0.9
default_statistics_target = 100
random_page_cost = 1.1

# ============================================================================
# WRITE-AHEAD LOG / DURABILITY
# ============================================================================
wal_level = 'replica'
max_wal_senders = 3
wal_keep_size = '512MB'

# ============================================================================
# AUTOVACUUM
# ============================================================================
autovacuum = on
autovacuum_naptime = '10s'

# ============================================================================
# LOCALE / TIME
# ============================================================================
datestyle = 'iso, mdy'
timezone = 'UTC'
