[package]
name = "blackbook"
version = "0.4.0"
edition = "2021"
description = "A Dockerized, end-to-end-encrypted secrets engine driven from a CLI: TLS 1.3 + mandatory mTLS, per-domain namespaces, group ACLs, TOTP MFA, and K-of-N threshold approvals."
license = "AGPL-3.0-only"
repository = "https://github.com/brian-summers/blackbook"
homepage = "https://brian-summers.github.io/blackbook/"
readme = "README.md"
rust-version = "1.94"
keywords = ["secrets", "vault", "encryption", "mtls", "cryptography"]
categories = ["cryptography", "command-line-utilities"]

# The CLI ships as `bbk` (matching the ~/.bbk home dir). The package/project
# keeps the name `blackbook`; only the invoked command is the short `bbk`.
[[bin]]
name = "bbk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
# OS-level process hardening for the long-lived server: disable core dumps and
# lock secret pages out of swap (mlockall) so the in-RAM master key can't reach
# disk. Linux-gated, best-effort.
libc = "0.2"
tokio = { version = "1.35", features = ["full"] }
# TLS to Postgres runs on rustls with aws-lc-rs, the same crypto backend as
# the CLI's HTTPS client below.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "json"] }
zeroize = "1.6"
scrypt = "0.11.0"
# Argon2id for the password paths only (credential-bundle unlock + explicit
# external passphrase). Deliberately separate from the server's per-message
# scrypt, which keys off high-entropy material and must stay fast.
argon2 = "0.5"
# No-echo passphrase prompt for `unlock` / interactive load.
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.5", features = ["v4", "serde"] }
home = "0.5.9"
aes-gcm = "0.10"
aes = "0.8"
rand = "0.8"
sha2 = "0.10"
sha3 = "0.10"
aes-kw = "0.2"
pbkdf2 = "0.13"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
actix-web = { version = "4.4", features = ["openssl"] }
actix-tls = { version = "3.0", features = ["openssl"] }
actix-rt = "2.8"
openssl = { version = "0.10", features = ["vendored"] }
# The CLI's HTTPS client. reqwest brings no crypto backend or root store of its
# own: client.rs hands it a rustls config on aws-lc-rs that pins the Blackbook
# CA and offers only the hybrid post-quantum X25519MLKEM768 key exchange (ring,
# the previous backend, has no ML-KEM). `prefer-post-quantum` also puts that
# group first for the Postgres link, so a Postgres that supports it picks it.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "logging"] }
tokio-util = "0.7"
futures-util = "0.3"
dirs = "6"
# Cert generation (CA + server + per-client) for TLS / mTLS.
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
time = "0.3"
# File uploads come in via raw PUT bodies, not multipart, so we don't need
# actix-multipart. mime_guess sniffs Content-Type from filenames when the
# client didn't send a header.
mime_guess = "2"
# TOTP — RFC 6238. Pinned to SHA1 in code so it works with stock authenticator
# apps; the secret bytes themselves are encrypted at rest under the master.
totp-rs = { version = "5", features = ["otpauth"] }
base32 = "0.4"
# Tunnel feature: HKDF-SHA256 to derive directional session keys from the
# X25519 shared secret; actix-ws for the relay's WebSocket endpoints. The client
# side upgrades the existing mTLS reqwest client to a WebSocket via
# reqwest-websocket, so the tunnel reuses the same cert + pinned CA as the REST
# API (no separate TLS config needed).
hkdf = "0.12"
# Real HMAC (RFC 2104) over SHA-2/SHA-3 for the user-facing crypto toolkit:
# keyed hashes, managed `hmac` keys, and HS256 tokens. Already in the tree via
# hkdf/pbkdf2; listed directly because crypto_ops uses it.
hmac = "0.12"
actix-ws = "0.3"
reqwest-websocket = "0.4"
# gzip for audit-log archives: old rows are exported to a compressed, encrypted,
# hash-chain-verifiable file on the data volume so the live chain stays bounded.
flate2 = "1"

# Lints. CI and scripts/check.sh run `cargo clippy --all-targets -- -D warnings`,
# so any warning not allowed here fails the build.
[lints.rust]
# The one audited `unsafe` block (process hardening in main.rs) carries an
# explicit #[allow(unsafe_code)]; any other `unsafe` has to argue for its own.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Findings that predate the gate, allowed so it can block everything new from
# the start. To burn one down, delete its line and fix what clippy reports.
doc_lazy_continuation = "allow"
io_other_error = "allow"
manual_is_multiple_of = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
print_literal = "allow"
redundant_closure = "allow"
result_large_err = "allow"
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
useless_format = "allow"
useless_vec = "allow"
while_let_loop = "allow"


# Optimise dependencies (not blackbook itself) in debug and test builds. The
# KDFs (Argon2id, scrypt, PBKDF2) are slow on purpose, and unoptimised they
# made the test suite take 4-6 minutes instead of about 5 seconds. That was
# long enough for GitHub to drop an SSH push while the pre-push hook ran.
# Debug assertions and overflow checks stay on; only code generation changes.
[profile.dev.package."*"]
opt-level = 2
