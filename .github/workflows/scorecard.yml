name: Scorecard

# OpenSSF Scorecard grades the project's own supply-chain practices (branch
# protection, pinned dependencies, token permissions, signed releases, code
# review...). Findings appear under Security → Code scanning, and the score is
# published at https://scorecard.dev/viewer/?uri=github.com/brian-summers/blackbook.
# Scorecard restricts this workflow: no top-level env or write permissions, and
# only its approved actions in the job.

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the workflow checks read the runs
      security-events: write # upload the SARIF report
      id-token: write # publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
