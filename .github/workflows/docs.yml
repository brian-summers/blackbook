name: Docs

# Builds the Zensical site (zensical.toml + docs/) and publishes it to GitHub
# Pages. Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # Pinned: Zensical is pre-1.0 and its config surface still moves. Bump
      # deliberately after checking `zensical build` locally.
      - run: pip install zensical==0.0.72
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
