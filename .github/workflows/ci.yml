name: CI

# Every push to main and every pull request; release.yml also runs it on the
# tagged commit before it publishes anything. Each step calls scripts/check.sh,
# so a contributor can run exactly the same checks locally.
#
# For branch protection, require the single "CI result" check: it passes only
# when every job here passed (or was skipped by design).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CI: "true"

jobs:
  lint:
    name: lint (fmt, pins, workflows, Dockerfile, secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - run: rustup toolchain install
      - name: fmt, pins, workflows, dockerfile, gitleaks
        run: bash scripts/check.sh fmt pins workflows dockerfile gitleaks
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy, tests
        shell: bash
        run: bash scripts/check.sh clippy test

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/check.sh msrv

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: coverage
        run: |
          bash scripts/check.sh coverage | tee coverage.txt
          { echo '### Line coverage'; echo '```'; grep -E '^(Filename|TOTAL|-)|\.rs ' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: target/lcov.info
          retention-days: 14

  deny:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: bash scripts/check.sh deny

  dependency-review:
    # Flags a pull request that adds a dependency with a known vulnerability,
    # using GitHub's advisory database (cargo-deny uses RustSec's).
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: false # deny.toml is the licence policy
          comment-summary-in-pr: never

  docker:
    name: docker (build, scan, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: blackbook:check
          cache-from: type=gha,scope=docker-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=docker-amd64' || '' }}
      - name: scan (Grype), end-to-end test
        run: bash scripts/check.sh scan e2e

  result:
    name: CI result
    if: always()
    needs: [lint, test, msrv, coverage, deny, dependency-review, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a CI job ended with '$r'"; exit 1 ;;
            esac
          done
