# Dependabot version updates. Security updates (for a dependency with a known
# advisory) are separate: enable them under Settings → Advanced Security; they
# ignore the schedule and cooldown below and open as soon as an advisory lands.
#
# Every update is an ordinary pull request, so CI (tests, cargo-deny, image
# scan, end-to-end test) has to pass before it can merge. The cooldown lets a
# new release age a week first: most malicious or broken releases are yanked
# within days.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
      # Breaking updates. Dependabot opened pre-1.0 bumps such as hkdf 0.12 ->
      # 0.13 as major, one PR per crate, and each failed CI on its own: the
      # RustCrypto crates (aes-gcm, hkdf, sha3, scrypt, pbkdf2...) share trait
      # crates and only build when they move together. One PR collects every
      # major bump; it stays red until the migration is done on its branch.
      cargo-major:
        update-types: [major]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base-image digests and the Rust builder version in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]

  # rust-toolchain.toml. The rust: image in the Dockerfile has to move with it
  # (scripts/check.sh pins fails until both agree), so expect to merge this
  # together with the matching docker update.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
